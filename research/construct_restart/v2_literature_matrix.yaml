candidate_contribution: Prospective testing of known-DGP-calibrated behavioral claim certification on a VLM intervention construct that is unimodally non-identifiable, cross-modally complementary, and free of direct conflict confounding.
closest_prior_art: MultiModalQA establishes complementary cross-modal multi-hop QA; MMStar and SugarCrepe establish visual-dependency and shortcut-audit expectations; none in this search combines those construct requirements with a prespecified paired evidence intervention and known-DGP-calibrated SESOI claim certification.
decision: NOVELTY_PASS_WITH_CAUTION
caution: The contribution is the joint prospective certification design, not a new reasoning task, benchmark primitive, statistical correction, or mechanism discovery.
