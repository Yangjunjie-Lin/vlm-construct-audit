schema_version: 1
registry_id: loop_a_unseen_dgp_v1
frozen_at: 2026-08-27
frozen_before_any_loop_a_result: true
baseline_method: A0_current_full_B5_at_aad52b0
sesoi: 0.10
sample_sizes: [48, 96, 192, 384]
repetitions_per_family_size_split: 100
repetitions_are_not_independent_families: true
development:
  scene_seed_formula: 51000 + sample_size * 1000 + family_index * 100 + repetition
  parameter_seed_range: [510000, 510099]
  template_namespace: loop_a_dev_template
  shortcut_markers: [DEV_ALPHA, DEV_BETA, DEV_GAMMA]
  parser_corruption_patterns: [drop_final_brace, option_shift_plus_one, duplicate_answer_key]
  entity_id_permutation_seed: 51017
holdout:
  scene_seed_formula: 91000 + sample_size * 1000 + family_index * 100 + repetition
  parameter_seed_range: [910000, 910099]
  template_namespace: loop_a_holdout_template
  shortcut_markers: [HOLD_KAPPA, HOLD_LAMBDA, HOLD_OMEGA]
  parser_corruption_patterns: [unicode_quote, option_shift_minus_one, trailing_entity_id]
  entity_id_permutation_seed: 91019
  execution_limit: one
  expected_classes_locked_before_execution: true
families:
  - family: ValidStrongEffect
    family_index: 1
    known_internal_state: {uptake: valid, reasoning: valid, measurement: valid, format_shortcut: false}
    target_estimand: E1_behavioral_ITT
    true_effect: {distribution: uniform, range: [0.24, 0.28], minimum_relative_to_SESOI: 2.4}
    expected_claim_class: VALID_BEHAVIORAL_EFFECT
    allowed_identification_status: BEHAVIORAL_ONLY_INTERNAL_MECHANISM_NOT_IDENTIFIED
    parameter_range: {uptake_probability: [0.96, 1.00], measurement_validity: [0.995, 1.00], contract_agreement: [0.97, 1.00], format_interaction: [-0.01, 0.01]}
    development_seed_range: [510000, 510099]
    holdout_seed_range: [910000, 910099]
  - family: ValidModerateEffect
    family_index: 2
    known_internal_state: {uptake: valid, reasoning: valid, measurement: valid, format_shortcut: false}
