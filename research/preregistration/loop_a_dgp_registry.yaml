metric_definitions:
  known_valid_sensitivity: valid_family_datasets_labelled_VALID_BEHAVIORAL_EFFECT / all_valid_family_datasets
  known_invalid_specificity: invalid_family_datasets_not_labelled_VALID_BEHAVIORAL_EFFECT / all_invalid_family_datasets
  fmcr: invalid_family_datasets_labelled_VALID_BEHAVIORAL_EFFECT / all_invalid_family_datasets
  coverage: valid_family_dataset_effect_CI_contains_dataset_true_effect / all_valid_family_datasets
  type_s: significant_valid_estimates_with_wrong_sign / significant_valid_estimates
  type_m: mean_absolute_estimate_over_true_effect_among_significant_valid_datasets
  abstention: INCONCLUSIVE_decisions / all_datasets
  partial_identification_accuracy: mixed_population_datasets_with_PARTIALLY_IDENTIFIED_status / all_mixed_population_datasets
primary_thresholds:
  measurement_lower: 0.98
  uptake_lower: 0.80
  effect_SESOI: 0.10
  contract_kappa: 0.90
  contract_kappa_lower: 0.85
  format_equivalence_margin: 0.05
diagnostic_threshold_grid:
  uptake_lower: [0.75, 0.80, 0.85]
  measurement_lower: [0.98, 0.99]
  contract_kappa: [0.90, 0.95]
  effect_SESOI: [0.10]
  format_equivalence_margin: [0.04, 0.05, 0.06]
  primary_decision_uses_grid: false
