    expected_claim_class: VALID_BEHAVIORAL_EFFECT
    allowed_identification_status: BEHAVIORAL_ONLY_INTERNAL_MECHANISM_NOT_IDENTIFIED
    parameter_range: {uptake_probability: [0.94, 0.99], measurement_validity: [0.995, 1.00], contract_agreement: [0.96, 1.00], format_interaction: [-0.015, 0.015]}
