collision_assessment:
  exact_conjunction_collision_found: false
  decision: NOVELTY_PASS_WITH_CAUTION
  caution: ATS and EviSafe materially narrow the VLM intervention/selection gap, while BCEA and structured-generation CRC cover much of the generic risk-control machinery.
  remaining_contribution: Prospective multi-family application of a power-calibrated claim-certification procedure to supplied-evidence VLM behavioral effects after known-DGP calibration.
  prohibited_as_novel:
    - SESOI
    - indifference zone
    - conformal prediction
    - selective prediction
    - risk-coverage curve
    - paired bootstrap
    - conditional likelihood
