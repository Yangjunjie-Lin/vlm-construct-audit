collision_conjunction:
  - VLM intervention study
  - known-state false-claim calibration
  - fixed SESOI
  - power-calibrated certification alternative
  - claim-level selective or risk-coverage decision
  - independent uptake validation
  - multi-family real VLM application
papers:
  - id: riesthuis_2024
    paper: "Simulation-Based Power Analyses for the Smallest Effect Size of Interest: A Confidence-Interval Approach for Minimum-Effect and Equivalence Testing"
    date: 2024-04-16
    venue_or_status: Advances in Methods and Practices in Psychological Science
    url: https://doi.org/10.1177/25152459241240722
    problem: Power analysis for minimum-effect and equivalence tests around a smallest effect size of interest.
    estimand: Generic population effect relative to a fixed SESOI.
    unit_of_certification: Study-level effect.
    models: None; statistical methodology.
    ground_truth: User-specified data-generating scenarios.
    risk_control: Confidence-interval decision probabilities under simulation.
    sesoi: Explicit.
    intervention_validity: Not applicable.
    overlap: Establishes that power must target the SESOI-aware decision, not ordinary rejection of zero.
    remaining_difference: No VLM, supplied-evidence intervention, uptake gate, known-state claim audit, or claim-level risk-coverage policy.
