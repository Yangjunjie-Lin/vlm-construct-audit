  updated_window: [2026-08-28, 2026-08-30]
  queries:
    - VLM selective prediction
    - MLLM conformal risk control
    - risk-coverage VLM evaluation
    - SESOI minimum-effect testing
    - power-calibrated certification
    - behavioral effect certification
    - multimodal intervention evaluation
