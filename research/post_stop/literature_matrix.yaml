    remaining_difference: Known-DGP certification of scene-level effect claims relative to a fixed SESOI and precomputed certification alternative, with explicit false-mechanistic-claim control and invalid-measurement/intervention states.
    prohibited_novelty_claims: [SESOI, indifference zone, selective prediction, conformal risk control]
    exact_conjunction_collision_found: false
