primary_metrics: [estimand_bias, RMSE, coverage, false_positive_rate, Type-S, FMCR, bound_width, bound_coverage, assumption_sensitivity, weak_instrument_failure_rate]
go_gates:
  point_identified_absolute_bias_max: 0.03
  point_identified_coverage_min: 0.90
  fmcr_max: 0.05
  type_s_max: 0.05
  partial_bound_coverage_min: 0.90
  partial_median_bound_width_max: 0.20
  informative_realistic_compliance_regimes_min: 2
  sensitivity_warning_rate_violation_settings: 1.00
  unconditional_valid_rate_violation_settings: 0.00
  fmcr_absolute_reduction_vs_naive_min: 0.10
known_DGP_claim_boundary: Known-potential-state methodological evidence only.
real_model_smoke:
  allowed_only_after_known_DGP_GO: true
  models: 3
  development_scenes: 20
  formal_downstream_claim: forbidden
  allowed_questions: [encouragement_changes_uptake_probability, assumptions_may_be_testable]
