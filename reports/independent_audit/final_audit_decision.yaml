decision_rationale: >-
  Printed entity IDs reveal the scene index, and index modulo four deterministically reveals both
  the gold answer and correct option position in every formal scene. This exact shortcut was not
  disclosed in the frozen preregistration. Correct evidence also duplicates the complete image
  geometry while corrupted evidence creates a direct image-text conflict and a different implied
  answer. The frozen experiment therefore cannot cleanly identify even its bounded supplied-
  evidence behavioral ITT, and it cannot support an internal-mechanism claim.
nonfatal_findings_retained:
  - aggregate uptake gate can mask primary relation-task failure
  - negative-control threshold is permissive and does not test answer or option priors
  - stable-path power is materially lower than marginal cell power
  - real-VLM discordance range lacks independent support
  - Path B is not mechanically deterministic
  - Mini-Pilot runner and independent scorer path are not bundled
