[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vlm-construct-audit"
version = "0.1.0"
description = "Validity-aware auditing for behavioral claims in vision-language models"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Yangjunjie Lin"}]
dependencies = ["PyYAML>=6.0", "numpy>=1.26", "scipy>=1.11"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
vlm-construct-audit = "vlm_construct_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
