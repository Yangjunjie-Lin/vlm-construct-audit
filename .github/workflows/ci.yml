name: tier0-ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: pytest
      - run: ruff check .
      - run: python -m vlm_construct_audit minimum-loop
        env:
          VLM_CA_CI: "1"
      - run: python -m vlm_construct_audit adjudicate-tier0-5
      - run: python -m vlm_construct_audit verify-artifacts
