name: tier0-ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: pytest
      - run: ruff check .
      - run: python -m vlm_construct_audit audit-final-review-integrity
      - run: python -m vlm_construct_audit build-final-successor-adjudication
      - run: python -m vlm_construct_audit build-final-negative-evidence-release
      - run: python -m vlm_construct_audit verify-final-closeout
      - run: python -m vlm_construct_audit minimum-loop
        env:
          VLM_CA_CI: "1"
      - run: python -m vlm_construct_audit adjudicate-tier0-5
      - run: python -m vlm_construct_audit verify-artifacts
      - run: python -m vlm_construct_audit verify-post-stop-artifacts
      - run: python -m vlm_construct_audit verify-frozen-p-mini-pilot-preregistration-read-only
      - run: python -m vlm_construct_audit validate-construct-v2
      - run: python -m vlm_construct_audit audit-construct-v2-leakage
      - run: python -m vlm_construct_audit run-construct-v2-oracles
      - run: python -m vlm_construct_audit verify-construct-v2-external-review-packages
      - run: python -m vlm_construct_audit verify-no-construct-v2-inference
      - run: python -m vlm_construct_audit validate-construct-v2-post-review-policy
